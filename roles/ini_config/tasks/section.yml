---
- name: Process configuration file section options
  community.general.ini_file:
    path: '{{ file.key }}'
    section: '{{ section.key }}'
    option: '{{ item.key }}'
    value: '{{ item.value }}'
    no_extra_spaces: '{{ file.value.no_extra_spaces | default(omit) }}'
    create: '{{ file.value.create | default(omit) }}'
    owner: '{{ file.value.owner | default(omit) }}'
    group: '{{ file.value.group | default(omit) }}'
    mode: '{{ file.value.mode | default(omit) }}'
  loop: '{{ section.value | default({}) | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
...
