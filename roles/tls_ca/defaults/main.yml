---
tls_ca_debug: '{{ debug | default(false) }}'

tls_ca_dir: ./secrets/{{ ca_name }}
tls_ca_key_path: '{{ tls_ca_dir }}/ca.key'
tls_ca_cert_path: '{{ tls_ca_dir }}/ca.crt'

tls_ca_basic_constraints: ['CA:TRUE']
tls_ca_basic_constraints_critical: true
tls_ca_common_name: LOCAL {{ ca_name | upper }} ROOT CA
tls_ca_ignore_timestamps: false
tls_ca_key_usage: [keyCertSign]
tls_ca_key_usage_critical: true
tls_ca_not_after: '21260101000000Z'
tls_ca_not_before: '20260101000000Z'
tls_ca_use_common_name_for_san: false

# tls_ca_certs:
#   elasticsearch:
#     common_name: LOCAL ELASTICSEARCH ROOT CA
tls_ca_certs: {}
...
