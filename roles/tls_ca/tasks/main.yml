---
- name: Create directories for certs and keys
  become: false
  delegate_to: localhost
  run_once: true
  ansible.builtin.file:
    path: '{{ tls_ca_dir }}'
    mode: '0755'
    state: directory
  loop: '{{ tls_ca_certs.keys() }}'
  loop_control:
    loop_var: ca_name

- name: Create private keys for CA
  become: false
  delegate_to: localhost
  run_once: true
  community.crypto.openssl_privatekey:
    path: '{{ tls_ca_key_path }}'
  diff: false
  loop: '{{ tls_ca_certs.keys() }}'
  loop_control:
    loop_var: ca_name
  no_log: '{{ not tls_ca_debug }}'

- name: Create certificate signing requests (CSRs) for CA certificates
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ca_name: '{{ item.key }}'
  community.crypto.openssl_csr_pipe:
    basic_constraints: '{{ item.value.basic_constraints |
      default(tls_ca_basic_constraints) }}'
    basic_constraints_critical: '{{ item.value.basic_constraints_critical |
      default(tls_ca_basic_constraints_critical) }}'
    common_name: '{{ item.value.common_name | default(tls_ca_common_name) }}'
    key_usage: '{{ item.value.key_usage | default(tls_ca_key_usage) }}'
    key_usage_critical: '{{ item.value.key_usage_critical |
      default(tls_ca_key_usage_critical) }}'
    privatekey_path: '{{ tls_ca_key_path }}'
    use_common_name_for_san: '{{ item.value.use_common_name_for_san |
      default(tls_ca_use_common_name_for_san) }}'
  changed_when: false
  loop: '{{ tls_ca_certs | ansible.builtin.dict2items }}'
  loop_control:
    label: '{{ ca_name }}'
  no_log: '{{ not tls_ca_debug }}'
  register: _tls_ca_csrs

- name: Create self-signed CA certificates from CSRs
  become: false
  delegate_to: localhost
  run_once: true
  vars:
    ca_name: '{{ item.item.key }}'
  community.crypto.x509_certificate:
    csr_content: "{{ item.csr }}"
    ignore_timestamps: '{{ item.item.value.ignore_timestamps |
      default(tls_ca_ignore_timestamps) }}'
    path: '{{ tls_ca_cert_path }}'
    privatekey_path: '{{ item.privatekey }}'
    provider: selfsigned
    selfsigned_not_after: '{{ item.value.item.not_after |
      default(tls_ca_not_after) }}'
    selfsigned_not_before: '{{ item.value.item.not_before |
      default(tls_ca_not_before) }}'
  diff: false
  loop: '{{ _tls_ca_csrs.results }}'
  loop_control:
    label: '{{ ca_name }}'
  no_log: '{{ not tls_ca_debug }}'
...
