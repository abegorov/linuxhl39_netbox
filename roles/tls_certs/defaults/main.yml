---
tls_certs_debug: '{{ debug | default(false) }}'

tls_certs_ca_dir: ./secrets/{{ ca_name }}
tls_certs_ca_key_path: '{{ tls_certs_ca_dir }}/ca.key'
tls_certs_ca_cert_path: '{{ tls_certs_ca_dir }}/ca.crt'
tls_certs_dir: '{{ tls_certs_ca_dir }}'
tls_certs_key_path: '{{ tls_certs_dir }}/{{ inventory_hostname }}.key'
tls_certs_cert_path: '{{ tls_certs_dir }}/{{ inventory_hostname }}.crt'

tls_certs_ca_content: '{{ lookup("ansible.builtin.file",
  tls_certs_ca_cert_path) }}'
tls_certs_ca_key_content: '{{ lookup("ansible.builtin.file",
  tls_certs_ca_key_path) }}'
tls_certs_common_name: '{{ inventory_hostname }}'
tls_certs_extended_key_usage: [serverAuth, clientAuth]
tls_certs_extended_key_usage_critical: false
tls_certs_ignore_timestamps: false
tls_certs_key_usage_critical: false
tls_certs_key_usage: [digitalSignature, keyEncipherment]
tls_certs_not_after: '21260101000000Z'
tls_certs_not_before: '20260101000000Z'
tls_certs_subject_alt_name:
  - 'DNS:{{ inventory_hostname_short }}'
  - 'DNS:localhost'
  - 'IP:{{ ip_address }}'
  - 'IP:127.0.0.1'
tls_certs_use_common_name_for_san: false

# tls_certs_certs:
#   elasticsearch:
tls_certs_certs: {}
...
