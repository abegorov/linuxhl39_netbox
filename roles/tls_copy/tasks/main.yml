---
- name: Update CA certificates
  ansible.builtin.copy:
    content: |
      {{ tls_copy_ca_content }}
    dest: '{{ tls_copy_ca_path }}'
    owner: '{{ tls_copy_cert_owner }}'
    group: '{{ tls_copy_cert_group }}'
    mode: '{{ tls_copy_cert_mode }}'
  no_log: '{{ not tls_copy_debug }}'
  loop: '{{ tls_copy_certs | ansible.builtin.dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  notify: '{{ tls_copy_notify }}'

- name: Update certificates
  ansible.builtin.copy:
    content: |
      {{ tls_copy_cert_content }}
      {% if tls_copy_ca_chain %}
      {{ tls_copy_ca_content }}
      {% endif %}
    dest: '{{ tls_copy_cert_path }}'
    owner: '{{ tls_copy_cert_owner }}'
    group: '{{ tls_copy_cert_group }}'
    mode: '{{ tls_copy_cert_mode }}'
  no_log: '{{ not tls_copy_debug }}'
  loop: '{{ tls_copy_certs | ansible.builtin.dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  notify: '{{ tls_copy_notify }}'

- name: Update keys
  community.crypto.openssl_privatekey_convert:
    src_content: '{{ tls_copy_key_content }}'
    dest_path: '{{ tls_copy_key_path }}'
    format: '{{ tls_copy_key_format }}'
    owner: '{{ tls_copy_key_owner }}'
    group: '{{ tls_copy_key_group }}'
    mode: '{{ tls_copy_key_mode }}'
  no_log: '{{ not tls_copy_debug }}'
  loop: '{{ tls_copy_certs | ansible.builtin.dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  notify: '{{ tls_copy_notify }}'
...
