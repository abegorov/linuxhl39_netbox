---
- name: Import certs role
  ansible.builtin.import_role:
    name: tls_copy
    public: false
  vars:
    tls_copy_certs: '{{ etcd_certs }}'
    tls_copy_key_owner: etcd
    tls_copy_notify: Restart etcd service

- name: Import config role
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ etcd_config }}'
    config_notify: Restart etcd service

- name: Enable and start etcd service
  ansible.builtin.systemd_service:
    name: etcd.service
    enabled: true
    daemon_reload: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'

- name: Force all notified handlers to run
  ansible.builtin.meta: flush_handlers
...
