---
- name: Import certs role
  ansible.builtin.import_role:
    name: tls_copy
    public: false
  vars:
    tls_copy_certs: '{{ pgbouncer_certs }}'
    tls_copy_key_owner: postgres
    tls_copy_notify: Restart pgbouncer service

- name: Import config role
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ pgbouncer_config }}'
    config_notify: Restart pgbouncer service

- name: Force all notified handlers to run
  ansible.builtin.meta: flush_handlers

- name: Enable and start pgbouncer service
  ansible.builtin.systemd_service:
    name: pgbouncer.service
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'
...
