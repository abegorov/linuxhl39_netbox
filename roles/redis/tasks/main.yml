---
- name: Import certs role
  ansible.builtin.import_role:
    name: tls_copy
    public: false
  vars:
    tls_copy_certs: '{{ redis_certs }}'
    tls_copy_key_owner: redis
    tls_copy_notify: Restart redis service

- name: Import config role
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ redis_config }}'
    config_notify: Restart redis service

- name: Force all notified handlers to run
  ansible.builtin.meta: flush_handlers

- name: Enable and start redis service
  ansible.builtin.systemd_service:
    name: redis.service
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'
...
