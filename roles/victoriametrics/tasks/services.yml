---
- name: Enable and start vmstorage service
  ansible.builtin.systemd_service:
    name: vmstorage.service
    daemon_reload: true
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'

- name: Enable and start vminsert service
  ansible.builtin.systemd_service:
    name: vminsert.service
    daemon_reload: true
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'

- name: Enable and start vmselect service
  ansible.builtin.systemd_service:
    name: vmselect.service
    daemon_reload: true
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'

- name: Enable and start vmagent service
  ansible.builtin.systemd_service:
    name: vmagent.service
    daemon_reload: true
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'

- name: Enable and start vmalert service
  ansible.builtin.systemd_service:
    name: vmalert.service
    daemon_reload: true
    enabled: true
    state: started
  ignore_errors: '{{ ansible_check_mode }}'
...
