---
- name: Import config role
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config }}'
    config_notify: Restart netbox service

- name: Create NetBox virtual environment
  ansible.builtin.command:
    cmd: '{{ netbox_dir }}/upgrade.sh'
    creates: '{{ netbox_dir }}/venv/bin/activate'
  throttle: 1

- name: Create NetBox superuser
  ansible.builtin.shell: |
    {{ netbox_dir }}/venv/bin/python3 {{
      netbox_dir }}/netbox/manage.py shell -c "
    import django
    django.setup()
    from django.contrib.auth import get_user_model
    User = get_user_model()
    username = '{{ netbox_superuser }}'
    email = '{{ netbox_superuser_email }}'
    password = '{{ netbox_superuser_password }}'

    if not User.objects.filter(username=username).exists():
        User.objects.create_superuser(username, email, password)
        print('CHANGED: Superuser created')
    else:
        u = User.objects.get(username=username)
        if u.email != email or not u.check_password(password):
            u.email = email
            u.set_password(password)
            u.save()
            print('CHANGED: Superuser credentials updated')
        else:
            print('SUCCESS: Superuser already up to date')
    "
  register: _netbox_superuser_creation
  changed_when: '"CHANGED:" in _netbox_superuser_creation.stdout'
...
