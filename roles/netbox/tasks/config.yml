---
- name: Import general config role
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config }}'

- name: Import config role for netbox service
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config_service }}'
    config_notify: Restart netbox service

- name: Import config role for netbox socket
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config_socket }}'
    config_notify: Restart netbox socket

- name: Import config role for netbox-rq service
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config_rq }}'
    config_notify: Restart netbox-rq service

- name: Import config role for netbox-housekeeping timer
  ansible.builtin.import_role:
    name: config
    public: false
  vars:
    config_content: '{{ netbox_config_housekeeping }}'
    config_notify: Restart netbox-housekeeping timer

- name: Create NetBox virtual environment
  ansible.builtin.command:
    cmd: '{{ netbox_dir }}/upgrade.sh'
    creates: '{{ netbox_dir }}/venv/bin/activate'
  throttle: 1

- name: Create NetBox superuser
  ansible.builtin.shell: |
    {{ netbox_dir }}/venv/bin/python3 {{
      netbox_dir }}/netbox/manage.py shell -c "
    import django
    django.setup()
    from users.models import User
    username = '{{ netbox_superuser }}'
    email = '{{ netbox_superuser_email }}'
    password = '{{ netbox_superuser_password }}'

    if not User.objects.filter(username=username).exists():
        User.objects.create_superuser(username, email, password)
        print('CHANGED: Superuser created')
    else:
        u = User.objects.get(username=username)
        if u.email != email or not u.check_password(password):
            u.email = email
            u.set_password(password)
            u.save()
            print('CHANGED: Superuser credentials updated')
        else:
            print('SUCCESS: Superuser already up to date')
    "
  register: _netbox_superuser_creation
  changed_when: '"CHANGED:" in _netbox_superuser_creation.stdout'
...
