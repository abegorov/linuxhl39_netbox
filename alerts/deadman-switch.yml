---
groups:
  - name: deadman-switch
    rules:
      - alert: Watchdog
        annotations:
          summary: Алерт, который должен работать постоянно, подтверждая
            исправность Alertmanager
          description: >-
            Этот алерт предназначен для проверки работоспособности всей
            цепочки оповещений. Он активен постоянно, поэтому должен
            всегда отображаться в Alertmanager и отправляться на
            принимающую сторону (receiver). Существуют интеграции с
            различными сервисами уведомлений, которые бьют тревогу,
            если этот алерт перестает приходить.
        expr: vector(1)
        labels:
          severity: none
...
