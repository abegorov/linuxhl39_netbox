---
victoriametrics_config_vminsert:
  /etc/systemd/system/vminsert.service:
    content: |
      [Unit]
      Description=VictoriaMetrics vminsert service
      After=network-online.target
      StartLimitInterval=0
      StartLimitIntervalSec=0

      [Service]
      Type=exec
      User=vminsert
      Group=vminsert
      ExecStart=/usr/local/bin/vminsert \
        -httpListenAddr=127.0.0.1:8480  \
        -replicationFactor=2 \
        -storageNode={% for _ in groups['logs']
          %}127.84.0.{{ loop.index }}:8400{{
          ',' if not loop.last else '' }}{% endfor %}

      SyslogIdentifier=vminsert
      Restart=always
      RestartSec=5

      CapabilityBoundingSet=
      LockPersonality=true
      NoNewPrivileges=true
      MemoryDenyWriteExecute=true
      PrivateTmp=true
      ProtectHome=true
      RemoveIPC=true
      RestrictSUIDSGID=true

      PrivateUsers=true
      ProtectControlGroups=true
      ProtectKernelModules=true
      ProtectKernelTunables=yes
      ProtectSystem=strict

      [Install]
      WantedBy=multi-user.target
...
