---
haproxy_certs:
  victoriametrics: /etc/haproxy
  vmstorage: /etc/haproxy

# yamllint disable rule:line-length
haproxy_config:
  # https://ssl-config.mozilla.org/ffdhe2048.txt
  /etc/haproxy/dhparam:
    content: |
      -----BEGIN DH PARAMETERS-----
      MIIBCAKCAQEA//////////+t+FRYortKmq/cViAnPTzx2LnFg84tNpWp4TZBFGQz
      +8yTnc4kmz75fS/jY2MMddj2gbICrsRhetPfHtXV/WVhJDP1H18GbtCFY2VVPe0a
      87VXE15/V8k1mE8McODmi3fipona8+/och3xWKE2rec1MKzKT0g6eXq8CrGCsyT7
      YdEIqUuyyOP7uWrat2DX9GgdT0Kj3jlN9K5W7edjcrsZCwenyO4KbXCeAvzhzffi
      7MA0BM0oNC9hkXL+nOmFg/+OTxIy7vKBg8P+OxtMb61zO7X8vC7CIAXFjvGDfRaD
      ssbzSibBsu/6iGtCOGEoXJf//////////wIBAg==
      -----END DH PARAMETERS-----
  /etc/haproxy/haproxy.cfg:
    mode: '0600'
    content: |
      global
        log /dev/log local0
        log /dev/log local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin
        stats timeout 30000
        tune.bufsize 65536
        user haproxy
        group haproxy
        daemon

        # Default SSL material locations
        ca-base /etc/haproxy
        crt-base /etc/haproxy

        # See: https://ssl-config.mozilla.org/#server=haproxy'
        ssl-default-bind-curves {{ haproxy_ssl_default_curves | join(":") }}
        ssl-default-bind-ciphers {{ haproxy_ssl_default_ciphers | join(":") }}
        ssl-default-bind-ciphersuites {{ haproxy_ssl_default_ciphersuites |
        join(":") }}
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
        ssl-default-server-ciphers {{ haproxy_ssl_default_ciphers | join(":") }}
        ssl-default-server-ciphersuites {{ haproxy_ssl_default_ciphersuites |
        join(":") }}
        ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
        ssl-dh-param-file /etc/haproxy/dhparam

        maxconn 400
      defaults
        log     global
        mode    http
        option http-keep-alive
        retries 2
        timeout connect 4s
        timeout http-keep-alive 60s
        timeout client  30m
        timeout server  30m
        timeout check   10s
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http
      userlist stats
        user stats password {{ haproxy_stats_password }}
      userlist victoriametrics
        user victoria password {{ haproxy_victoria_password_hash }}
      listen stats
        bind 127.0.0.1:7000
        bind [::1]:7000
        http-request auth unless { http_auth(stats) }
        stats enable
        stats uri /
      listen vmagent_ingress
        bind {{ ip_address }}:8429 ssl crt "victoriametrics.crt" alpn h2,http/1.1
        http-request auth unless { http_auth(victoriametrics) }
        server localhost 127.0.0.1:8429
      listen vmalert_ingress
        bind {{ ip_address }}:8483 ssl crt "victoriametrics.crt" alpn h2,http/1.1
        http-request auth unless { http_auth(victoriametrics) }
        server localhost 127.0.0.1:8483
      listen vminsert_ingress
        bind {{ ip_address }}:8480 ssl crt "victoriametrics.crt" alpn h2,http/1.1
        http-request auth unless { http_auth(victoriametrics) }
        server localhost 127.0.0.1:8480
      listen vmselect_ingress
        bind {{ ip_address }}:8481 ssl crt "victoriametrics.crt" alpn h2,http/1.1
        http-request auth unless { http_auth(victoriametrics) }
        server localhost 127.0.0.1:8481
      listen vmstorage_ingress
        bind {{ ip_address }}:8482 ssl crt "victoriametrics.crt" alpn h2,http/1.1
        http-request auth unless { http_auth(victoriametrics) }
        server localhost 127.0.0.1:8482
      listen vmstorage_insert_ingress
        mode tcp
        bind {{ ip_address
        }}:8400 ssl verify required ca-file "vmstorage-ca.crt" crt "vmstorage.crt"
        server localhost 127.0.0.1:8400
      listen vmstorage_select_ingress
        mode tcp
        bind {{ ip_address
        }}:8401 ssl verify required ca-file "vmstorage-ca.crt" crt "vmstorage.crt"
        server localhost 127.0.0.1:8401
      {% for server in groups['logs'] %}
      listen vmselect_egress{{ loop.index }}
        bind 127.84.81.{{ loop.index }}:8481
        http-request set-header Authorization "Basic {{
          ('victoria:' + haproxy_victoria_password) | ansible.builtin.b64encode
        }}"
        server {{ server }} {{ hostvars[server].ip_address
        }}:8481 ssl verify required ca-file "victoriametrics-ca.crt" crt "victoriametrics.crt"
      listen vmstorage_insert_egress{{ loop.index }}
        mode tcp
        bind 127.84.0.{{ loop.index }}:8400
        server {{ server }} {{ hostvars[server].ip_address
        }}:8400 ssl verify required ca-file "vmstorage-ca.crt" crt "vmstorage.crt"
      listen vmstorage_select_egress{{ loop.index }}
        mode tcp
        bind 127.84.1.{{ loop.index }}:8401
        server {{ server }} {{ hostvars[server].ip_address
        }}:8401 ssl verify required ca-file "vmstorage-ca.crt" crt "vmstorage.crt"
      {% endfor %}
...
