---
victoriametrics_config_vmselect:
  /etc/systemd/system/vmselect.service:
    content: |
      [Unit]
      Description=VictoriaMetrics vmselect service
      After=network-online.target
      StartLimitInterval=0
      StartLimitIntervalSec=0

      [Service]
      Type=exec
      User=vmselect
      Group=vmselect
      ExecStart=/usr/local/bin/vmselect \
        -dedup.minScrapeInterval=60s  \
        -httpListenAddr=127.0.0.1:8481 \
        -replicationFactor=2 \
        -selectNode={% for _ in groups['logs']
          %}127.84.81.{{ loop.index }}:8481{{
          ',' if not loop.last else '' }}{% endfor %} \
        -storageNode={% for _ in groups['logs']
          %}127.84.1.{{ loop.index }}:8401{{
          ',' if not loop.last else '' }}{% endfor %}

      SyslogIdentifier=vmselect
      Restart=always
      RestartSec=5

      CapabilityBoundingSet=
      LockPersonality=true
      NoNewPrivileges=true
      MemoryDenyWriteExecute=true
      PrivateTmp=true
      ProtectHome=true
      RemoveIPC=true
      RestrictSUIDSGID=true

      PrivateUsers=true
      ProtectControlGroups=true
      ProtectKernelModules=true
      ProtectKernelTunables=yes
      ProtectSystem=strict

      [Install]
      WantedBy=multi-user.target
...
