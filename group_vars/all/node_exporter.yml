---
user_add_node_exporter:
  node_exporter:

node_exporter_certs:
  node_exporter: /etc/node_exporter

node_exporter_file_groups:
  - paths: [/etc/node_exporter]
    state: directory

node_exporter_unarchive:
  node_exporter.tar.gz:
    checksum: >-
      sha256:9f5ea48e5bc7b656f8a91a32e7d7deb89f70f73dabd0d974418aca15f37d6810
    include: ['*/node_exporter']
    url: "https://github.com/prometheus/node_exporter/releases/download/\
      v1.11.1/node_exporter-1.11.1.linux-amd64.tar.gz"

node_exporter_config:
  /etc/node_exporter/web.yml:
    content: |
      tls_server_config:
        cert_file: /etc/node_exporter/node_exporter.crt
        key_file: /etc/node_exporter/node_exporter.key
        client_auth_type: RequireAndVerifyClientCert
        client_ca_file: /etc/node_exporter/node_exporter-ca.crt
  /etc/systemd/system/node_exporter.service:
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network-online.target
      StartLimitInterval=0
      StartLimitIntervalSec=0

      [Service]
      Type=exec
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter \
        --collector.systemd \
        --web.listen-address={{ ip_address }}:9100 \
        --web.config.file=/etc/node_exporter/web.yml

      SyslogIdentifier=node_exporter
      Restart=always
      RestartSec=5

      CapabilityBoundingSet=
      LockPersonality=true
      NoNewPrivileges=true
      MemoryDenyWriteExecute=true
      PrivateTmp=true
      ProtectHome=true
      RemoveIPC=true
      RestrictSUIDSGID=true

      PrivateUsers=true
      ProtectControlGroups=true
      ProtectKernelModules=true
      ProtectKernelTunables=yes
      ProtectSystem=strict

      [Install]
      WantedBy=multi-user.target
...
