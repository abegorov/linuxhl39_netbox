---
haproxy_stats_password: '{{ lookup("ansible.builtin.password",
  "secrets/haproxy_stats_password.txt", length=26, encrypt="sha512_crypt") }}'

haproxy_victoria_password: '{{ lookup("ansible.builtin.password",
  "secrets/haproxy_victoria_password.txt", length=26) }}'
haproxy_victoria_password_hash: '{{ lookup("ansible.builtin.password",
  "secrets/haproxy_victoria_password.txt", length=26,
  encrypt="sha512_crypt") }}'

haproxy_ssl_default_curves:
  - X25519
  - prime256v1
  - secp384r1
haproxy_ssl_default_ciphers:
  - ECDHE-ECDSA-AES128-GCM-SHA256
  - ECDHE-RSA-AES128-GCM-SHA256
  - ECDHE-ECDSA-AES256-GCM-SHA384
  - ECDHE-RSA-AES256-GCM-SHA384
  - ECDHE-ECDSA-CHACHA20-POLY1305
  - ECDHE-RSA-CHACHA20-POLY1305
  - DHE-RSA-AES128-GCM-SHA256
  - DHE-RSA-AES256-GCM-SHA384
  - DHE-RSA-CHACHA20-POLY1305
haproxy_ssl_default_ciphersuites:
  - TLS_AES_128_GCM_SHA256
  - TLS_AES_256_GCM_SHA384
  - TLS_CHACHA20_POLY1305_SHA256
...
