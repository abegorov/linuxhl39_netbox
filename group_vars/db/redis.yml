---
lineinfile_file_redis:
  /root/.bashrc:
    - regexp: '^export REDISCLI_AUTH='
      line: export REDISCLI_AUTH='{{ redis_password }}'
    - regexp: '^alias redis-cli='
      line: alias redis-cli='redis-cli -h "${REDISCLI_HOST:-127.0.0.1}"
        -p "${REDISCLI_PORT:-6379}" --tls --cacert /etc/redis/redis-ca.crt
        --cert /etc/redis/redis.crt --key /etc/redis/redis.key'

redis_master: '{{ groups["db"] | first }}'

redis_certs:
  redis: /etc/redis

redis_tls_ciphers:
  - ECDHE-ECDSA-AES128-GCM-SHA256
  - ECDHE-RSA-AES128-GCM-SHA256
  - ECDHE-ECDSA-AES256-GCM-SHA384
  - ECDHE-RSA-AES256-GCM-SHA384
  - ECDHE-ECDSA-CHACHA20-POLY1305
  - ECDHE-RSA-CHACHA20-POLY1305
  - DHE-RSA-AES128-GCM-SHA256
  - DHE-RSA-AES256-GCM-SHA384
  - DHE-RSA-CHACHA20-POLY1305
redis_tls_ciphersuites:
  - TLS_AES_128_GCM_SHA256
  - TLS_AES_256_GCM_SHA384
  - TLS_CHACHA20_POLY1305_SHA256

redis_config:
  /etc/redis/dhparam:
    content: |
      -----BEGIN DH PARAMETERS-----
      MIIBCAKCAQEA//////////+t+FRYortKmq/cViAnPTzx2LnFg84tNpWp4TZBFGQz
      +8yTnc4kmz75fS/jY2MMddj2gbICrsRhetPfHtXV/WVhJDP1H18GbtCFY2VVPe0a
      87VXE15/V8k1mE8McODmi3fipona8+/och3xWKE2rec1MKzKT0g6eXq8CrGCsyT7
      YdEIqUuyyOP7uWrat2DX9GgdT0Kj3jlN9K5W7edjcrsZCwenyO4KbXCeAvzhzffi
      7MA0BM0oNC9hkXL+nOmFg/+OTxIy7vKBg8P+OxtMb61zO7X8vC7CIAXFjvGDfRaD
      ssbzSibBsu/6iGtCOGEoXJf//////////wIBAg==
      -----END DH PARAMETERS-----
  /etc/redis/redis.conf:
    owner: redis
    mode: '0600'
    content: |
      bind 127.0.0.1 {{ ip_address }} -::1
      protected-mode yes
      # https://ssl-config.mozilla.org/#server=redis
      port 0
      tls-port 6379
      tls-cluster yes
      tls-replication yes
      tls-auth-clients yes
      tls-cert-file /etc/redis/redis.crt
      tls-key-file /etc/redis/redis.key
      tls-ca-cert-file /etc/redis/redis-ca.crt
      tls-protocols "TLSv1.2 TLSv1.3"
      tls-prefer-server-ciphers no
      tls-ciphers {{ redis_tls_ciphers | join(':') }}
      tls-ciphersuites {{ redis_tls_ciphersuites | join(':') }}
      tls-dh-params-file /etc/redis/dhparam
      masterauth "{{ redis_password }}"
      requirepass "{{ redis_password }}"
      tcp-backlog 511
      timeout 0
      tcp-keepalive 300
      daemonize yes
      supervised auto
      pidfile /run/redis/redis-server.pid
      loglevel notice
      logfile /var/log/redis/redis-server.log
      databases 16
      always-show-logo no
      set-proc-title yes
      proc-title-template "{title} {listen-addr} {server-mode}"
      locale-collate ""
      stop-writes-on-bgsave-error yes
      rdbcompression yes
      rdbchecksum yes
      dbfilename dump.rdb
      rdb-del-sync-files no
      dir /var/lib/redis
      {% if inventory_hostname != redis_master %}
      replicaof {{ hostvars[redis_master].ip_address }} 6379
      {% endif %}
      replica-serve-stale-data yes
      replica-read-only yes
      repl-diskless-sync yes
      repl-diskless-sync-delay 5
      repl-diskless-sync-max-replicas 0
      repl-diskless-load disabled
      repl-disable-tcp-nodelay no
      replica-priority 100
      acllog-max-len 128
      lazyfree-lazy-eviction no
      lazyfree-lazy-expire no
      lazyfree-lazy-server-del no
      replica-lazy-flush no
      lazyfree-lazy-user-del no
      lazyfree-lazy-user-flush no
      oom-score-adj no
      oom-score-adj-values 0 200 800
      disable-thp yes
      appendonly yes
      appendfilename "appendonly.aof"
      appenddirname "appendonlydir"
      appendfsync everysec
      no-appendfsync-on-rewrite no
      auto-aof-rewrite-percentage 100
      auto-aof-rewrite-min-size 64mb
      aof-load-truncated yes
      aof-use-rdb-preamble yes
      aof-timestamp-enabled no
      slowlog-log-slower-than 10000
      slowlog-max-len 128
      latency-monitor-threshold 0
      notify-keyspace-events ""
      hash-max-listpack-entries 512
      hash-max-listpack-value 64
      list-max-listpack-size -2
      list-compress-depth 0
      set-max-intset-entries 512
      set-max-listpack-entries 128
      set-max-listpack-value 64
      zset-max-listpack-entries 128
      zset-max-listpack-value 64
      hll-sparse-max-bytes 3000
      stream-node-max-bytes 4096
      stream-node-max-entries 100
      activerehashing yes
      client-output-buffer-limit normal 0 0 0
      client-output-buffer-limit replica 256mb 64mb 60
      client-output-buffer-limit pubsub 32mb 8mb 60
      hz 10
      dynamic-hz yes
      aof-rewrite-incremental-fsync yes
      rdb-save-incremental-fsync yes
      jemalloc-bg-thread yes
...
